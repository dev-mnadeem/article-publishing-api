name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: local-ci-password
          POSTGRES_DB: project_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portfolio -d project_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://portfolio:local-ci-password@localhost:5432/project_test
      TEST_DATABASE_URL: postgresql://portfolio:local-ci-password@localhost:5432/project_test
      JWT_KEY: local-ci-only-signing-key
      JWT_SECRET: local-ci-only-signing-key
      SUMMARY_PROVIDER: local
      BCRYPT_ROUNDS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm test
      - run: npm run build
